# Déploiement continu sur Render — toute la ludothèque (Monopoly, Fantasy, le Gabo).
#
# Un site 24h/24 pour la famille demande deux choses qu'un service gratuit
# n'offre pas : un disque qui survit aux redémarrages (sinon les parties
# sauvegardées disparaissent, voir CLAUDE.md §2 bis) et un service qui ne s'éteint
# jamais faute d'activité (le plan gratuit se met en veille après 15 minutes).
# Toutes les deux exigent le plan payant `starter`.
#
# Pour déployer : sur render.com, « New » → « Blueprint », choisir ce dépôt et
# la branche `main`. Render lit ce fichier et propose de créer le service tel
# quel — il ne reste qu'à confirmer.
#
# Le service et son disque gardent leurs noms d'origine (`monopoly`,
# `monopoly-data`) même si le dépôt s'appelle désormais JeuSociete : les
# renommer ici ferait créer à Render un NOUVEAU service avec un disque vide,
# et toutes les parties sauvegardées resteraient sur l'ancien.
services:
  - type: web
    name: monopoly
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: monopoly-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Dossier de sauvegarde de TOUS les jeux (le Gabo écrit dans /data/gabo).
      - key: MONOPOLY_DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: 22
